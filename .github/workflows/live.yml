name: Live data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-live
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch live data
        run: python fetch_live.py

      - name: Run paper trader
        run: python paper_trader.py

      - name: Push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Descartar cambios no stagiados en CSV (los gestiona historical.yml, no este workflow)
          git restore data/btc_1h.csv data/eth_1h.csv 2>/dev/null || git checkout -- data/btc_1h.csv data/eth_1h.csv 2>/dev/null || true
          git add data/live_data.json data/paper_trading.json data/paper_state.json || true
          git diff --cached --quiet && exit 0
          git commit -m "live data $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push intento $i fallido. Reintento."
            sleep $((i * 2))
          done
          echo "Push failed after 5 retries"
          exit 1
